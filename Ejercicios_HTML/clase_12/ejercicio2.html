<!doctype html>
<html lang="es">

<head>

    <!-- Título para el navegador y los buscadores -->
    <title>Ejemplo etiqueta fieldset y legend</title>

    <!-- Descripción de la página para los buscadores -->
    <meta name="description" content="Página de ejemplos vistos en clase">

    <!-- Palabras clave para los buscadores -->
    <meta name="keywords" content="p, h1, h2, h3, h4, h5">

    <!-- Autor de la página -->
    <meta name="author" content="@jonascampos">

    <!-- Favicon de la página -->
    <link rel="icon" href="favicon.ico" type="image/x-icon">

    <!-- Codificación-->
    <meta charset="UTF-8">

    <!-- Para que la web sea responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Para algunos navegadores móviles -->
    <meta name="theme-color" content="#1e7bbf">

</head>

<body>
    <header>
        <p><a href="index.html">👈 Volver atrás</a></p>
        <hr />
    </header>
  <main>
    <h3>Formulario estructurado</h3>
   
    <form action="" name="registro" method="get" autocomplete="off">
    <fieldset>
        <legend>Datos personales</legend>
    <p>
        <label for="name">Nombre</label><br>
        <input type="text" name="Nombre" id="name" >
    </p>
    <p>
        <label for="first/second_name">Apellidos</label><br>
        <input type="text" name="Apellidos" id="first/second_name" >
    </p>
    <p>
        <label for="dni">DNI</label><br>
        <input type="text" name="Dni" id="dni" size="6" >
    </p>
    </fieldset>
    
    <fieldset>
        <legend>Datos de conexión</legend>
        <p>
            <label for="name">Nombre de ususario</label><br>
            <input type="text" name="nombre" id="name">
        </p>
        <p>
            <label for="pass">Contraseña</label><br>
            <input type="text" name="Contraseña" id="pass">
        </p>
        <p>
            <label for="pass2">Repite la contraseña</label><br>
            <input type="text" name="Contraseña2" id="pass2">
        </p>
    </fieldset>
    </form>


    </main>
    <hr>
    <footer>
        
        
        © 2025 - Todos los derechos reservados
    </footer>
</body>

</html>
