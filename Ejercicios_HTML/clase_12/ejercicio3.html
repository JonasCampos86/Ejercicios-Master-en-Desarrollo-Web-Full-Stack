<!doctype html>
<html lang="es">

<head>

    <!-- Título para el navegador y los buscadores -->
    <title>Rellena tu CV</title>

    <!-- Descripción de la página para los buscadores -->
    <meta name="description" content="Página de ejemplos vistos en clase">

    <!-- Palabras clave para los buscadores -->
    <meta name="keywords" content="p, h1, h2, h3, h4, h5">

    <!-- Autor de la página -->
    <meta name="author" content="@jonascampos">

    <!-- Favicon de la página -->
    <link rel="icon" href="favicon.ico" type="image/x-icon">

    <!-- Codificación-->
    <meta charset="UTF-8">

    <!-- Para que la web sea responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Para algunos navegadores móviles -->
    <meta name="theme-color" content="#1e7bbf">

</head>

<body>
    <header>
        <p><a href="index.html">👈 Volver atrás</a></p>
        <hr />
    </header>
  <main>
    <h3>Formulario estructurado</h3>
   
    <form action="" name="registro" method="get" autocomplete="off">
    <fieldset>
        <legend>Datos personales</legend>
    <p>
        <label for="provincia">Provincia</label><br>
        <select name="provincia" id="provincia">
            <option value="">-seleciona-</option>
            <option value="Madrid">Madrid</option>
            <option value="Valencia">Valencia</option>
            <option value="Caceres">Caceres</option>
        </select>
    </p>
    <p>
       Fecha de nacimiento <br>
       <input type="text" name="dia" size="2">de
       <select name="mes" id="mes">
        <option value="">---</option>
        <option value="ene">Enero</option>
        <option value="feb">Febrero</option>
        <option value="mar">Marzo</option>
        <option value="abr">Abril</option>
        <option value="may">Mayo</option>
        <option value="jun">Junio</option>
        <option value="jul">Julio</option>
        <option value="ago">Agosto</option>
        <option value="sep">Septiembre</option>
        <option value="oct">Octubre</option>
        <option value="nob">Noviembre</option>
        <option value="dic">Diciembre</option>
       </select>
       de<input type="text" name="año" size="2">
    </p>
    <p>
        <label for="intereses">Temas de interés</label><br>
        <select name="interes" id="intereses" multiple size="5">
            <option value="1">Coches</option>
            <option value="2">Motos</option>
            <option value="3">Juegos</option>
            <option value="4">Libros</option>
            <option value="5">Deportes</option>
            <option value="6">Ajedrez</option>
            <option value="7">Tecnologia</option>
        </select>
    </p>
    
    </form>
    </fieldset>
    <br>
    <button>Enviar</button>
    </main>
    <hr>
    <footer>
        © 2025 - Todos los derechos reservados
    </footer>
</body>

</html>
