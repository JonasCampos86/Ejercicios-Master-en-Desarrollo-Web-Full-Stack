  <main>
    <h2>Ejemplos vistos en la Clase 11</h2>
    <div>
    <h3>Uso de la Etiqueta label </h3>
    <h4>Realiza tu pedido de pizza</h4>
    <h5>Seleccione el tamaño de la pizza</h5>
    <form action="#" name="registro" method="get" autocomplete="on">
    
    <p><input type="radio" name="tamaño" value="Pequeña" id="small">
    <label for="small">Pequeña</label></p>
    <p><input type="radio" name="tamaño" value="Mediana" id="mid">
    <label for="mid">Mediana</label></p>
    <p><input type="radio" name="tamaño" value="Familiar" id="Family">
    <label for="Family">Familiar</label></p>
    <h5>Selecione las salsa base></h5>
    <p><input type="radio" name="Base" value="Tomate" id="Tomate"> <label for="Tomate">Tomate</label></p>
    <p><input type="radio" name="Base" value="Nata" id="Nata"> <label for="Nata"> Nata</label></p>
    <p><input type="radio" name="Base" value="Barbacoa" id="Barbacoa"><label for="Barbacoa">Barbacoa</label></p>
    <h5>Seleccione los ingredientes</h5>
    <p><input type="checkbox" name="Queso" id="Queso"><label for="Queso">Queso</label></p>
    <p><input type="checkbox" name="Jamón" id="Jamón"> <label for="Jamón">Jamón</label></p>
    <p><input type="checkbox" name="Piña" id="Piña"><label for="Piña">Piña</label></p>
    <p><input type="checkbox" name="Atún" id="Atún"><label for="Atún">Atún</label></p>
    <p><input type="checkbox" name="Peperonni" id="Peperonni"><label for="Peperonni">Peperonni</label></p>
    <p><input type="checkbox" name="Champiñón" id="Champiñón"><label for="Champiñón">Champiñón</label></p>

    <p><button>Enviar</button></p>
    </form>


    </main>
