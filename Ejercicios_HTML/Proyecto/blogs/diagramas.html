        <h2>¿Qué es un Diagrama de Flujo?</h2>
        <p>
          Un *diagrama de flujo* es una representación visual de un proceso mediante
           símbolos y flechas que indican el flujo y el orden de ejecución. En pocas 
           palabras, es un mapa que muestra los pasos a seguir para resolver un problema 
           o completar una tarea.
