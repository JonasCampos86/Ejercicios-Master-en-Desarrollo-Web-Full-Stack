    <h1>Vamos a probar la etiqueta a con sus atributos más destacados.</h1>
    <h2>Atributo href con sus targets</h2>
    <p>Href con target _blank pincha <a href="https://valleros.eu/" target="_blank">aquí </a>te llevara a una nueva pestaña </p>
    <p>Href con target _self pincha <a href="https://vallerosracingshop.com/" target="_self">aquí </a>te al enlace en esta misma pestaña </p>
